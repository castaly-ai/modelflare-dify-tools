identity:
  name: generate_image
  author: modelflare
  label:
    en_US: Generate Image
    zh_Hans: 生成图像
description:
  human:
    en_US: Generate or edit an image with any image model available to your Modelflare key.
    zh_Hans: 用你的 Modelflare Key 可用的任意图像模型生成或编辑图像。
  llm: Generates or edits an image with a Modelflare image model and returns the image file.
parameters:
  - name: model
    type: dynamic-select
    required: true
    form: form
    label:
      en_US: Model
      zh_Hans: 模型
    human_description:
      en_US: Image models available to your key.
      zh_Hans: 你的 Key 可用的图像模型。
  - name: prompt
    type: string
    required: true
    form: llm
    label:
      en_US: Prompt
      zh_Hans: 提示词
    human_description:
      en_US: What to generate.
      zh_Hans: 要生成的内容。
    llm_description: The image description.
  - name: parameters
    type: string
    required: false
    form: form
    label:
      en_US: Model parameters (JSON)
      zh_Hans: 模型参数（JSON）
    human_description:
      en_US: Model-specific fields such as size or quality, sent unchanged. See the model's page on docs.modelflare.dev.
      zh_Hans: 尺寸、质量等模型专属字段，原样发送。请参考 docs.modelflare.dev 上该模型的页面。
  - name: edit
    type: boolean
    required: false
    default: false
    form: form
    label:
      en_US: Edit mode
      zh_Hans: 编辑模式
    human_description:
      en_US: Use the edits route; put the source images in the model parameters as the model's page describes.
      zh_Hans: 使用编辑接口；按模型页面的说明把源图放进模型参数。
extra:
  python:
    source: tools/generate_image.py
